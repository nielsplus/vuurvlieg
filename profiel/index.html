  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg: #030303;
      --panel: #0a0a0a;
      --panel-2: #101010;
      --line: rgba(200, 168, 75, 0.18);
      --gold: #c8a84b;
      --gold-soft: rgba(200, 168, 75, 0.55);
      --glow: #aaff44;
      --text: #e9e4d6;
      --muted: #8d8778;
      --serif: 'Cormorant Garamond', 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.65;
      overflow-x: hidden;
    }
    a { color: inherit; }

    /* Zwevende vuurvliegjes op de achtergrond */
    #fireflies { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    main { position: relative; z-index: 1; }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
    section { padding: 72px 0; }
    .eyebrow {
      font-size: 11px; letter-spacing: 5px; text-transform: uppercase;
      color: var(--gold); opacity: 0.75; margin-bottom: 10px;
    }
    h2 {
      font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 5vw, 42px);
      color: var(--text); margin-bottom: 32px; letter-spacing: 0.5px;
    }
    h2::after {
      content: ""; display: block; width: 64px; height: 1px; margin-top: 14px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    /* Navigatie */
    nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(3, 3, 3, 0.72); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 16px; }
    .brand { font-family: var(--serif); letter-spacing: 5px; color: var(--gold); text-decoration: none; font-size: 15px; white-space: nowrap; }
    .brand span { color: var(--glow); text-shadow: 0 0 8px var(--glow); }
    nav ul { display: flex; gap: 22px; list-style: none; font-size: 13px; overflow-x: auto; scrollbar-width: none; }
    nav ul::-webkit-scrollbar { display: none; }
    nav a.link { text-decoration: none; color: var(--muted); transition: color .2s; white-space: nowrap; }
    nav a.link:hover { color: var(--gold); }

    /* Hero */
    .hero { min-height: calc(100vh - 56px); display: flex; align-items: center; padding: 48px 0; }
    .hero-grid { display: grid; grid-template-columns: 300px 1fr; gap: 56px; align-items: center; }
    .avatar-wrap { position: relative; width: 280px; height: 320px; margin: 0 auto; }
    .avatar-wrap svg.frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .avatar {
      position: absolute; left: 20px; top: 20px; width: 240px; height: 274px;
      clip-path: path('M120 0 L240 45 V160 Q240 230 120 274 Q0 230 0 160 V45 Z');
      background: radial-gradient(circle at 50% 40%, #1c1a12, #070707 70%);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 84px; color: var(--gold);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero h1 {
      font-family: var(--serif); font-weight: 500;
      font-size: clamp(44px, 8vw, 76px); line-height: 1.02; letter-spacing: 1px;
    }
    .hero .role { font-size: clamp(16px, 2.2vw, 20px); color: var(--gold); margin: 14px 0 6px; font-weight: 400; }
    .hero .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
    .hero .meta span::before { content: "◆ "; color: var(--gold-soft); font-size: 9px; vertical-align: 2px; }
    .hero .tagline { margin: 24px 0 30px; max-width: 560px; font-size: 17px; color: #cfc9b8; }
    .status {
      display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 1px;
      border: 1px solid rgba(170, 255, 68, 0.3); color: var(--glow); padding: 5px 12px; border-radius: 99px; margin-bottom: 20px;
    }
    .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px var(--glow); animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

    .btns { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; font-size: 13px; letter-spacing: 1px;
      text-decoration: none; border: 1px solid var(--gold-soft); color: var(--gold); border-radius: 2px;
      transition: background .25s, color .25s, box-shadow .25s;
    }
    .btn:hover { background: var(--gold); color: #070707; box-shadow: 0 0 24px rgba(200,168,75,.35); }
    .btn.solid { background: var(--gold); color: #070707; }
    .btn.solid:hover { background: #e0c262; }
    .btn svg { width: 15px; height: 15px; }

    /* Kerncijfers */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
    .stat { background: var(--panel); padding: 28px 20px; text-align: center; }
    .stat b { display: block; font-family: var(--serif); font-size: 46px; font-weight: 500; color: var(--gold); line-height: 1; }
    .stat span { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }

    /* Over mij */
    .about { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; }
    .about p { color: #cfc9b8; margin-bottom: 16px; font-size: 16px; }
    .quote {
      border-left: 1px solid var(--gold); padding: 6px 0 6px 24px; align-self: start;
      font-family: var(--serif); font-style: italic; font-size: 24px; line-height: 1.4; color: var(--text);
    }
    .quote small { display: block; margin-top: 12px; font-family: var(--sans); font-style: normal; font-size: 12px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }

    /* Tijdlijn */
    .timeline { position: relative; padding-left: 40px; }
    .timeline::before {
      content: ""; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 1px;
      background: linear-gradient(var(--gold), rgba(200,168,75,.1));
    }
    .tl-item { position: relative; padding-bottom: 40px; }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-dot {
      position: absolute; left: -40px; top: 4px; width: 23px; height: 23px; border-radius: 50%;
      background: var(--bg); border: 1px solid var(--gold-soft);
      display: flex; align-items: center; justify-content: center;
    }
    .tl-dot::after {
      content: ""; width: 7px; height: 7px; border-radius: 50%; background: #333;
      transition: background .8s, box-shadow .8s;
    }
    .tl-item.lit .tl-dot::after { background: var(--glow); box-shadow: 0 0 12px 3px rgba(170,255,68,.6); }
    .tl-card {
      background: var(--panel); border: 1px solid var(--line); padding: 22px 24px; border-radius: 2px;
      transition: border-color .3s, transform .3s;
    }
    .tl-card:hover { border-color: var(--gold-soft); transform: translateX(4px); }
    .tl-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
    .tl-head h3 { font-family: var(--serif); font-weight: 600; font-size: 22px; }
    .tl-period { font-size: 12px; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
    .tl-org { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
    .tl-card p { color: #c4beae; font-size: 15px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .tag { font-size: 11px; letter-spacing: .5px; padding: 3px 10px; border: 1px solid var(--line); color: var(--muted); border-radius: 99px; }

    /* Vaardigheden */
    .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .radar { width: 100%; max-width: 420px; margin: 0 auto; display: block; overflow: visible; }
    .radar .axis { stroke: var(--line); }
    .radar .ring { fill: none; stroke: var(--line); }
    .radar .shape { fill: rgba(170,255,68,.10); stroke: var(--glow); stroke-width: 1.5; filter: drop-shadow(0 0 6px rgba(170,255,68,.5)); }
    .radar .pt { fill: var(--glow); }
    .radar text { fill: var(--muted); font-size: 11px; font-family: var(--sans); letter-spacing: 1px; }
    .bars { display: flex; flex-direction: column; gap: 18px; }
    .bar-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 7px; }
    .bar-top span:last-child { color: var(--muted); font-size: 12px; }
    .bar { height: 3px; background: #1a1a1a; position: relative; overflow: visible; }
    .bar i {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--gold), var(--glow));
      transition: width 1.6s cubic-bezier(.2,.8,.2,1);
    }
    .bar i::after {
      content: ""; position: absolute; right: -4px; top: -3px; width: 9px; height: 9px; border-radius: 50%;
      background: var(--glow); box-shadow: 0 0 12px 2px var(--glow);
    }

    /* Projecten */
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card {
      background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 1px solid var(--line);
      padding: 26px; position: relative; overflow: hidden; transition: transform .3s, border-color .3s;
    }
    .card::before {
      content: ""; position: absolute; width: 180px; height: 180px; right: -60px; top: -60px; border-radius: 50%;
      background: radial-gradient(rgba(170,255,68,.16), transparent 70%); transition: transform .5s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--gold-soft); }
    .card:hover::before { transform: scale(1.5); }
    .card .num { font-family: var(--serif); font-size: 15px; color: var(--gold); letter-spacing: 3px; }
    .card h3 { font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 8px 0 10px; }
    .card p { color: #bdb7a7; font-size: 14.5px; }


    /* Certificaten */
    .cert-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 28px; }
    .cert-chart { display: flex; align-items: flex-end; gap: 6px; overflow-x: auto; padding-bottom: 4px; max-width: 100%; }
    .yr-btn {
      background: none; border: 1px solid transparent; color: var(--muted); font-family: var(--sans); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 10px; min-width: 52px; border-radius: 2px;
      transition: border-color .2s, color .2s;
    }
    .yr-btn:hover { color: var(--text); }
    .yr-btn.on { border-color: var(--gold-soft); color: var(--gold); }
    .yr-btn .stack { display: flex; flex-direction: column-reverse; gap: 3px; min-height: 10px; }
    .yr-btn .stack i { width: 22px; height: 7px; border-radius: 1px; opacity: .85; }
    .yr-btn b { font-family: var(--serif); font-size: 22px; font-weight: 500; line-height: 1; color: var(--text); }
    .yr-btn em { font-style: normal; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
    .cert-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
    .cert-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
    .cert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .cert {
      background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--c); padding: 16px 18px;
      transition: transform .3s, border-color .3s, opacity .9s;
    }
    .cert:hover { transform: translateY(-3px); border-color: var(--gold-soft); border-top-color: var(--c); }
    .cert.hide { display: none; }
    .cert-yr { font-size: 11px; letter-spacing: 2px; color: var(--c); margin-bottom: 6px; }
    .cert h3 { font-family: var(--serif); font-weight: 600; font-size: 18px; line-height: 1.25; }
    .cert p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .edu-row.no-yr { grid-template-columns: 1fr; }

    /* Opleiding + talen */
    .duo { display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; }
    .edu { border-top: 1px solid var(--line); }
    .edu-row { display: grid; grid-template-columns: 110px 1fr; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .edu-row .yr { color: var(--gold); font-size: 13px; letter-spacing: 1px; padding-top: 3px; }
    .edu-row h3 { font-family: var(--serif); font-size: 20px; font-weight: 600; }
    .edu-row p { color: var(--muted); font-size: 14px; }
    .lang { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .lang:first-child { border-top: 1px solid var(--line); }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 9px; height: 9px; border-radius: 50%; background: #222; }
    .dots i.on { background: var(--glow); box-shadow: 0 0 8px rgba(170,255,68,.7); }
    .interests { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
    .interests .tag { font-size: 13px; padding: 6px 14px; color: var(--text); }

    /* Contact */
    .contact { text-align: center; padding: 96px 0 64px; }
    .contact h2::after { margin-left: auto; margin-right: auto; }
    .contact p { color: var(--muted); max-width: 520px; margin: 0 auto 28px; }
    .contact .btns { justify-content: center; }
    footer { text-align: center; padding: 32px 16px 48px; color: var(--gold); opacity: .4; font-family: var(--serif); letter-spacing: 6px; font-size: 13px; }
    footer a { text-decoration: none; }

    /* Verschijnen bij scrollen */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform .9s ease; }
    .reveal.in { opacity: 1; transform: none; }

    @media (max-width: 860px) {
      .hero-grid, .about, .skills-grid, .duo { grid-template-columns: 1fr; gap: 36px; }
      .hero { text-align: center; min-height: auto; }
      .hero .meta, .btns { justify-content: center; }
      .hero .tagline { margin-left: auto; margin-right: auto; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .cards { grid-template-columns: 1fr; }
      nav ul { gap: 16px; }
    }
    @media (max-width: 520px) {
      nav ul { display: none; }
      .avatar-wrap { transform: scale(.85); margin: -24px auto; }
      .edu-row { grid-template-columns: 1fr; gap: 2px; }
      section { padding: 56px 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>

function radar(items) {
  const n = items.length, cx = 210, cy = 210, R = 150;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  let rings = "";
  for (const f of [0.25, 0.5, 0.75, 1]) {
    rings += `<polygon class="ring" points="${items.map((_, i) => pt(i, R * f).join(",")).join(" ")}"/>`;
  }
  let axes = "", labels = "";
  items.forEach((s, i) => {
    const [x, y] = pt(i, R);
    axes += `<line class="axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    const [lx, ly] = pt(i, R + 26);
    const anchor = Math.abs(lx - cx) < 5 ? "middle" : lx > cx ? "start" : "end";
    labels += `<text x="${lx}" y="${ly + 4}" text-anchor="${anchor}">${esc(s.naam)}</text>`;
  });
  const shape = items.map((s, i) => pt(i, (R * s.score) / 100).join(",")).join(" ");
  const dots = items.map((s, i) => { const [x, y] = pt(i, (R * s.score) / 100); return `<circle class="pt" cx="${x}" cy="${y}" r="3.5"/>`; }).join("");
  return `<svg class="radar" viewBox="-40 0 500 420" role="img" aria-label="Vaardighedenweb">
    ${rings}${axes}
    <g class="radar-shape" style="transform-origin:${cx}px ${cy}px;transform:scale(0);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)">
      <polygon class="shape" points="${shape}"/>${dots}
    </g>${labels}</svg>`;
}

/* Animaties bij in beeld komen */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el) {
  const target = +el.dataset.count, plus = el.dataset.plus === "1";
  if (reduce) { el.textContent = target + (plus ? "+" : ""); return; }
  const t0 = performance.now(), dur = 1600;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), v = Math.round(target * (1 - Math.pow(1 - k, 3)));
    el.textContent = v + (plus && k === 1 ? "+" : "");
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    const el = e.target;
    el.classList.add("in");
    if (el.classList.contains("tl-item")) setTimeout(() => el.classList.add("lit"), 300);
    el.querySelectorAll("[data-count]").forEach(countUp);
    el.querySelectorAll(".bar i").forEach(b => b.style.width = b.dataset.w + "%");
    el.querySelectorAll(".radar-shape").forEach(g => g.style.transform = "scale(1)");
    io.unobserve(el);
  }
}, { threshold: 0.15 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* Vuurvliegjes op de achtergrond */
(() => {
  const c = document.getElementById("fireflies"), ctx = c.getContext("2d");
  let w, h, flies = [];
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    c.width = w * dpr; c.height = h * dpr; c.style.width = w + "px"; c.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(40, (w * h) / 32000));
    flies = Array.from({ length: count }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .25, vy: (Math.random() - .5) * .25,
      r: 1 + Math.random() * 1.8, p: Math.random() * Math.PI * 2, s: .008 + Math.random() * .018
    }));
  };
  const draw = () => {
    ctx.clearRect(0, 0, w, h);
    for (const f of flies) {
      if (!reduce) {
        f.p += f.s; f.x += f.vx + Math.sin(f.p * .7) * .15; f.y += f.vy + Math.cos(f.p * .5) * .15;
        if (f.x < -20) f.x = w + 20; if (f.x > w + 20) f.x = -20;
        if (f.y < -20) f.y = h + 20; if (f.y > h + 20) f.y = -20;
      }
      const a = .15 + .85 * Math.pow((Math.sin(f.p) + 1) / 2, 3);
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 9);
      g.addColorStop(0, `rgba(170,255,68,${.5 * a})`);
      g.addColorStop(1, "rgba(170,255,68,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(240,255,220,${a})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * .6, 0, Math.PI * 2); ctx.fill();
    }
    if (!reduce) requestAnimationFrame(draw);
  };
  addEventListener("resize", () => { resize(); if (reduce) draw(); });
  resize(); draw();
})();
