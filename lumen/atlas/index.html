<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Atlas | Lumen</title>
  <meta name="description" content="Agentic Intake Atlas: an interactive map of an agent architecture, growing with six maturity levels.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lumen/assets/lumen.css">
  <style>
    .atlas { display: flex; flex-direction: column; gap: 16px; padding: 40px 0 24px; }
    .atlas header .sub { color: #c4beae; max-width: 80ch; margin-top: 10px; }
    .tagline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .pill { font: 500 11.5px/1 var(--mono); padding: 5px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 16px; min-width: 0; }
    .card h2 { font: 500 11px/1.3 var(--sans); text-transform: uppercase; letter-spacing: 4px; color: var(--gold); opacity: .8; margin: 0 0 12px; }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .controls label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .atlas select, .atlas button { font: 400 13.5px var(--sans); color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 2px; padding: 7px 11px; cursor: pointer; }
    .atlas select:hover, .atlas button:hover { border-color: var(--gold-soft); }
    .atlas .primary { background: var(--gold); color: #070707; border-color: var(--gold); font-weight: 500; }
    .atlas .primary:hover { background: #e0c262; }
    .sep { width: 1px; height: 26px; background: var(--line); }
    .switch { display: flex; align-items: center; gap: 8px; }
    .switch .dot { width: 28px; height: 16px; border-radius: 9px; background: #262626; position: relative; transition: background .2s; }
    .switch .dot::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #8d8778; transition: transform .2s, background .2s; }
    .switch[aria-pressed="true"] .dot::after { transform: translateX(12px); background: #070707; }
    #lens[aria-pressed="true"] { border-color: var(--integ); color: var(--integ); background: var(--integ-soft); }
    #lens[aria-pressed="true"] .dot { background: var(--integ); }
    #route[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(170,255,68,.06); }
    #route[aria-pressed="true"] .dot { background: var(--accent); }
    .picked { font: 12px var(--mono); color: var(--muted); }

    .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
    @media (min-width: 1100px) { .main { grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); } }
    .levels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-bottom: 10px; }
    .atlas .lvb { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 7px 9px; text-align: left; min-width: 0; }
    .lvb b { font: 500 15px var(--sans); color: var(--gold); line-height: 1.1; }
    .lvb span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .atlas .lvb[aria-checked="true"] { background: rgba(200,168,75,.14); border-color: var(--gold); box-shadow: 0 0 18px rgba(200,168,75,.18); }
    .lvb[aria-checked="true"] span { color: var(--text); }
    .lvdesc { font-size: 14.5px; margin: 0 0 10px; max-width: 90ch; color: #d4cebd; }
    .lvdesc b { color: var(--text); font-weight: 500; }
    .lvdesc .iw { color: var(--integ); }
    .hstrip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 10px; }
    .hsl { font-size: 13px; color: var(--muted); margin-right: 4px; }
    .atlas .hs { font: 400 12px var(--sans); padding: 4px 9px; border: 1px dashed rgba(255,255,255,.14); color: var(--muted); background: none; }
    .atlas .hs.on { border: 1px solid var(--harness); background: var(--harness-soft); color: var(--harness); }
    .hs i { font: 500 10px var(--mono); font-style: normal; margin-right: 5px; }
    .diagram { overflow-x: auto; }
    .diagram svg { display: block; width: 100%; min-width: 760px; height: auto; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
    .legend span { display: flex; align-items: center; gap: 7px; }
    .sw { width: 18px; height: 12px; border-radius: 2px; display: inline-block; }
    .sw.det { background: var(--code-fill); border: 1px solid var(--code-line); }
    .sw.prob { background: var(--model-fill); border: 1px dashed var(--model-line); border-radius: 6px; }
    .sw.human { background: var(--human-fill); border: 1.5px solid var(--human-line); border-radius: 6px; }
    .sw.har { border: 1.5px dashed var(--harness); }
    .sw.evo { height: 3px; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .sw.ik { width: 11px; height: 11px; border-radius: 50%; background: var(--integ); }
    .sw.im { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--integ); }

    /* svg */
    .zone { fill: none; stroke: rgba(255,255,255,.10); stroke-dasharray: 2 4; }
    .zonelabel { font: 500 10px var(--sans); letter-spacing: 2.5px; fill: var(--muted); text-transform: uppercase; }
    .zg { transition: opacity .3s; }
    .harframe { fill: var(--harness-soft); stroke: var(--harness); stroke-width: 1.2; stroke-dasharray: 6 5; transition: opacity .3s; }
    .harlabel { font: 500 10px var(--sans); letter-spacing: 2.5px; fill: var(--harness); }
    .edge { stroke: rgba(255,255,255,.12); stroke-width: 1.3; fill: none; transition: stroke .2s, opacity .3s; }
    .edge.bypass { stroke-dasharray: 5 5; }
    .node { cursor: pointer; transition: opacity .3s; }
    .node:focus { outline: none; }
    .node rect { stroke-width: 1.3; transition: stroke-width .15s, filter .2s; }
    .node.det rect { fill: var(--code-fill); stroke: var(--code-line); }
    .node.prob rect { fill: var(--model-fill); stroke: var(--model-line); stroke-dasharray: 5 4; }
    .node.human rect { fill: var(--human-fill); stroke: var(--human-line); stroke-width: 1.8; }
    .node .nl { font: 500 13.5px var(--sans); fill: var(--code-ink); }
    .node.prob .nl { fill: var(--model-ink); }
    .node.human .nl { fill: var(--human-ink); }
    .node .ns { font: 400 10.5px var(--sans); fill: var(--muted); }
    .node .nt { font: 500 9px var(--mono); letter-spacing: .08em; fill: var(--code-line); }
    .node.prob .nt { fill: var(--model-line); }
    .node.human .nt { fill: var(--human-line); }
    .node:hover rect, .node:focus-visible rect { stroke-width: 2.2; }
    .node.sel rect { stroke: var(--gold); stroke-width: 2.5; }
    .node.act rect { stroke: var(--accent); stroke-width: 2.6; filter: drop-shadow(0 0 6px rgba(170,255,68,.5)); }
    .node.caught rect { stroke: var(--warn); stroke-width: 2.6; }
    .node.fail rect { stroke: var(--bad); stroke-width: 2.6; }
    .node.ok rect { stroke: var(--good); stroke-width: 2.2; }
    .node.wait rect { stroke: var(--human-line); stroke-width: 3.2; filter: drop-shadow(0 0 8px rgba(224,176,73,.6)); }
    .node.rel rect { stroke: var(--harness); stroke-width: 2.6; filter: drop-shadow(0 0 6px rgba(95,214,200,.45)); }
    .node.evo .ns { fill: var(--accent); font-weight: 500; }
    .imark { display: none; }
    svg.lens .imark { display: inline; }
    .imark.kern { fill: var(--integ); }
    .imark.mee { fill: var(--panel); stroke: var(--integ); stroke-width: 2; }
    svg.lens .node.igeen { opacity: .45; }
    .node.off { opacity: .28; }
    .node.ghost, svg.lens .node.ghost { opacity: .08; }
    /* Het verzoek reist als vuurvliegje door de plaat */
    .tok { fill: #f0ffe0; filter: drop-shadow(0 0 6px #aaff44) drop-shadow(0 0 14px rgba(170,255,68,.6)); }
    .tokring { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: .45; }
    .fl path { fill: none; stroke: var(--accent); stroke-width: 1.6; }
    .fl { transition: opacity .25s; }
    .fl.next { display: none; }
    svg.fullroute .fl.next { display: inline; opacity: .25; }
    .fl.start, .fl.cur { opacity: 1; }
    .fl.done { opacity: .45; }
    .fl.done path { stroke: var(--code-line); stroke-width: 1.2; }
    .fl.done .fb circle { stroke: var(--code-line); }
    .fl.done .fb text { fill: var(--code-line); }
    svg.flowing .edge { opacity: .1 !important; }
    .fl.cur path { stroke-width: 2.8; filter: drop-shadow(0 0 4px rgba(170,255,68,.5)); }
    .fb { cursor: pointer; }
    .fb circle { fill: var(--panel); stroke: var(--accent); stroke-width: 1.4; }
    .fb text { font: 600 10px var(--mono); fill: var(--accent); text-anchor: middle; dominant-baseline: central; }
    .fb:hover circle, .fb:focus-visible circle { stroke-width: 2.6; }
    .fb:focus { outline: none; }
    .fl.cur .fb circle { fill: var(--accent); }
    .fl.cur .fb text { fill: #070707; }

    /* paneel */
    .panel .ptitle { font: 600 24px/1.2 var(--serif); margin: 0 0 8px; color: var(--text); }
    .panel p { margin: 6px 0; max-width: 65ch; font-size: 14.5px; color: #d4cebd; }
    .badge { display: inline-block; font: 500 10.5px/1 var(--mono); letter-spacing: .04em; padding: 4px 7px; border-radius: 2px; margin: 0 6px 4px 0; vertical-align: 2px; }
    .b-det { background: var(--code-fill); color: var(--code-ink); border: 1px solid var(--code-line); }
    .b-prob { background: var(--model-fill); color: var(--model-ink); border: 1px dashed var(--model-line); }
    .b-human { background: var(--human-fill); color: var(--human-ink); border: 1px solid var(--human-line); }
    .b-har { background: var(--harness-soft); color: var(--harness); border: 1px solid var(--harness); }
    .b-lv { color: var(--muted); border: 1px solid var(--line); }
    .gname { color: var(--muted); font-size: 12.5px; }
    .lbl { font: 500 10.5px var(--sans); text-transform: uppercase; letter-spacing: 2.5px; color: var(--gold); opacity: .8; margin: 16px 0 5px; }
    .atlas pre { font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; margin: 0; background: #050505; border: 1px solid var(--line-soft); border-radius: 2px; padding: 9px 11px; color: var(--code-ink); }
    .note { border-radius: 2px; padding: 9px 11px; margin-top: 10px; font-size: 14px; }
    .n-ok { background: var(--good-soft); color: var(--good); }
    .n-bad { background: var(--bad-soft); color: var(--bad); }
    .n-warn { background: var(--warn-soft); color: var(--warn); }
    .n-human { background: var(--human-fill); color: var(--human-ink); }
    .n-integ { background: var(--integ-soft); color: var(--integ); border-left: 2px solid var(--integ); }
    .n-integ b { display: block; font: 500 10.5px var(--sans); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 3px; }
    .ilist, .evol { margin: 8px 0 0; padding: 0; list-style: none; font-size: 14px; }
    .ilist li, .evol li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); color: var(--muted); }
    .ilist li b, .evol b { font: 500 13.5px var(--sans); color: var(--gold); }
    .ilist .w { color: var(--integ); }
    .evol li.cur { color: var(--text); }
    .evol li.cur b { color: var(--accent); }
    .evol em { font-style: normal; font-weight: 500; display: block; color: var(--text); }
    .hitl { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .hitl button { flex: 1; min-width: 120px; }
    .atlas .approve { border-color: var(--good); color: var(--good); }
    .atlas .reject { border-color: var(--bad); color: var(--bad); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .atlas .chip { font: 400 13px var(--sans); padding: 6px 12px; border-radius: 99px; }
    .chip i { font: 500 10.5px var(--mono); font-style: normal; color: var(--gold); margin-right: 5px; }
    .chip.later { opacity: .5; }
    .atlas .chip[aria-pressed="true"] { border-color: var(--harness); background: var(--harness-soft); color: var(--harness); opacity: 1; }
    .tlead { font-size: 14px; color: var(--muted); margin: 0 0 10px; max-width: 90ch; }
    .tlwrap { overflow-x: auto; }
    .tl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
    .tl th { text-align: left; font: 500 10.5px var(--sans); text-transform: uppercase; letter-spacing: 2px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
    .tl td { padding: 9px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    .tl tbody tr { cursor: pointer; }
    .tl tbody tr:hover { background: #0e0e0e; }
    .tl tbody tr.on { background: var(--harness-soft); }
    .tl tbody tr:focus-visible { outline: 2px solid var(--glow); outline-offset: -2px; }
    .td-d { white-space: nowrap; color: var(--muted); }
    .td-l { font: 13px var(--mono); color: var(--gold); }
    .lower { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
    @media (min-width: 900px) { .lower { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
    .log { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; font-size: 13.5px; }
    .log li { display: grid; grid-template-columns: 28px 128px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); align-items: baseline; }
    .log .k { font: 11px var(--mono); color: var(--muted); }
    .log .ty { font: 500 10px var(--mono); letter-spacing: .04em; }
    .ty.det { color: var(--code-line); } .ty.prob { color: var(--model-line); } .ty.human { color: var(--human-line); }
    .log li.caught .msg { color: var(--warn); } .log li.fail .msg { color: var(--bad); } .log li.ok .msg { color: var(--good); }
    .empty { color: var(--muted); font-size: 14px; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .m { background: #050505; border: 1px solid var(--line-soft); padding: 10px 12px; }
    .m .ml { font-size: 12px; color: var(--muted); }
    .m .mv { font: 400 22px/1.2 var(--sans); color: var(--text); }
    .m .mv.good { color: var(--good); } .m .mv.bad { color: var(--bad); } .m .mv.warn { color: var(--warn); }
    .checklist { margin: 0; padding-left: 18px; font-size: 14px; color: #d4cebd; }
    .checklist li { margin: 4px 0; }
    .foot { font-size: 13px; color: var(--muted); max-width: 90ch; }
    .loading { color: var(--muted); padding: 40px 0; }
    @media (max-width: 640px) { .lvb span { display: none; } .log li { grid-template-columns: 26px minmax(0, 1fr); } .log .ty { grid-column: 2; } .log .msg { grid-column: 2; } }
  </style>
</head>
<body data-wide="1">
<main class="wrap wide">
  <div class="atlas" id="atlas">
    <p class="loading" id="loading">…</p>
  </div>
</main>
<script src="/lumen/assets/lumen.js"></script>
<script src="/lumen/atlas/atlas.js"></script>
</body>
</html>
