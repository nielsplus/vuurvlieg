<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Lifecycle | Lumen</title>
  <meta name="description" content="Lumen Lifecycle: how an agent is built and improved, from goal and data to validation and feedback, per maturity level.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lumen/assets/lumen.css?v=2026-11-22">
  <style>
    .head { padding: 72px 0 16px; }
    .lvbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0 8px; }
    .lvbar button { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; cursor: pointer; transition: all .25s; }
    .lvbar button:hover { color: var(--text); border-color: var(--gold-soft); }
    .lvbar button[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); font-weight: 500; }
    .lvnote { color: #c4beae; font-size: 15px; max-width: 760px; min-height: 24px; }
    .flow { position: relative; padding-left: 44px; margin-top: 28px; }
    .flow::before { content: ""; position: absolute; left: 13px; top: 10px; bottom: 10px; width: 1px; background: linear-gradient(var(--gold), rgba(200,168,75,.08)); }
    .stap { position: relative; margin-bottom: 18px; }
    .num { position: absolute; left: -44px; top: 16px; width: 27px; height: 27px; border-radius: 50%; border: 1px solid var(--gold-soft); background: var(--bg); color: var(--gold); font-family: var(--mono); font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .stap h2 { font-family: var(--serif); font-weight: 600; font-size: 26px; line-height: 1.2; margin-bottom: 6px; }
    .stap .w { color: #c4beae; font-size: 15px; }
    .stap .now { margin-top: 14px; padding: 12px 14px; border-left: 2px solid var(--gold); background: rgba(200,168,75,.05); font-size: 15px; }
    .stap .now .k { display: block; font-family: var(--mono); font-size: 11.5px; letter-spacing: 1px; color: var(--gold); margin-bottom: 4px; }
    .stap ul { margin: 12px 0 0 18px; color: #c4beae; font-size: 14.5px; }
    .stap ul li { margin-bottom: 4px; }
    .stap .extra { color: var(--muted); font-size: 13.5px; margin-top: 8px; }
    .seams { padding: 24px 0 40px; }
    .seams h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; margin-bottom: 8px; }
    .seam { display: block; text-decoration: none; color: var(--text); margin-top: 12px; transition: border-color .3s, transform .3s; }
    .seam:hover { border-color: var(--gold-soft); transform: translateX(4px); color: var(--text); }
    .seam b { font-weight: 500; }
    .seam p { color: #c4beae; font-size: 14.5px; margin-top: 4px; }
    .seam .go { color: var(--gold); font-size: 13px; letter-spacing: 1px; }
    .err { color: var(--muted); }
  </style>
</head>
<body>
<main id="app"></main>
<script src="/lumen/assets/lumen.js?v=2026-11-22"></script>
<script>
const TXT = {
  en: { eyebrow: "Lumen · build and improve", title: "Lifecycle", lead: "The Agentic Atlas shows what runs when a request comes in. This plate shows how that system is built and kept good: from goal and data to validation and feedback. Choose a level and see what each step looks like there.", level: "Level", step: "Step", seams: "Where the two plates meet", seamsLead: "The work is on the seams. These four links connect the Lifecycle to the Agentic Atlas.", atlas: "Show on the Atlas →", err: "The Lifecycle could not be loaded." },
  nl: { eyebrow: "Lumen · bouwen en verbeteren", title: "Lifecycle", lead: "De Agentic Atlas laat zien wat er draait als een verzoek binnenkomt. Deze plaat laat zien hoe dat systeem wordt gebouwd en goed blijft: van doel en data tot validatie en terugkoppeling. Kies een level en zie wat elke stap daar inhoudt.", level: "Level", step: "Stap", seams: "Waar de twee platen elkaar raken", seamsLead: "Het werk zit op de naden. Deze vier koppelingen verbinden de Lifecycle met de Agentic Atlas.", atlas: "Bekijk op de Atlas →", err: "De Lifecycle kon niet worden geladen." }
};
let DATA = null, LEVELS = [], FAILED = false, LV = 4;

/* Tekst voor een level: het hoogste genoemde level dat niet boven het gekozen level ligt */
function at(stap, lv) {
  const keys = Object.keys(stap.evolutie).map(Number).filter(k => k <= lv).sort((a, b) => b - a);
  return keys.length ? { k: keys[0], v: stap.evolutie[keys[0]] } : null;
}

function render() {
  const t = TXT[Lumen.lang], { T, esc } = Lumen;
  document.title = `${t.title} | Lumen`;
  let body = "";
  if (FAILED) body = `<p class="err">${esc(t.err)}</p>`;
  else if (DATA) {
    const lvl = LEVELS[LV];
    const bar = LEVELS.map((l, i) => `<button type="button" data-lv="${i}" aria-pressed="${i === LV}">L${i} ${esc(T(l.n))}</button>`).join("");
    const steps = DATA.stappen.map((s, i) => {
      const cur = at(s, LV);
      return `<article class="lm-card stap reveal"><div class="num">${i}</div>
        <h2>${esc(T(s.n))}</h2><p class="w">${esc(T(s.w))}</p>
        ${s.deel ? `<ul>${s.deel.map(d => `<li>${esc(T(d))}</li>`).join("")}</ul>` : ""}
        ${s.extra ? `<p class="extra">${esc(T(s.extra))}</p>` : ""}
        ${cur ? `<div class="now"><span class="k">${esc(t.level)} ${LV}${cur.k !== LV ? ` · ${esc(t.level)} ${cur.k}` : ""}</span>${esc(T(cur.v))}</div>` : ""}
      </article>`;
    }).join("");
    const seams = DATA.koppelingen.map(k => `<a class="lm-card seam" href="/lumen/atlas/?lv=${k.lv}&blokken=${encodeURIComponent(k.blokken.join(","))}">
        <b>${esc(T(k.t))}</b><p>${esc(T(k.w))}</p><span class="go">${esc(t.atlas)}</span></a>`).join("");
    body = `<div class="lvbar" role="group" aria-label="${esc(t.level)}">${bar}</div>
      <p class="lvnote">${lvl ? esc(T(lvl.d)) : ""}</p>
      <div class="flow">${steps}</div>
      <section class="seams"><h2>${esc(t.seams)}</h2><p class="lead">${esc(t.seamsLead)}</p>${seams}</section>`;
  }
  document.getElementById("app").innerHTML = `<section class="head"><div class="wrap">
    <div class="eyebrow">${esc(t.eyebrow)}</div><h1 class="lm-title">${esc(t.title)}</h1><p class="lead" style="margin-top:18px">${esc(t.lead)}</p>
  </div></section><section><div class="wrap">${body}</div></section>`;
  document.querySelectorAll(".lvbar button").forEach(b => b.addEventListener("click", () => { LV = +b.dataset.lv; render(); }));
  Lumen.reveal();
}
Promise.all([Lumen.json("/lumen/data/lifecycle.json"), Lumen.json("/lumen/data/blokken.json")])
  .then(([d, b]) => { DATA = d; LEVELS = b.levels; render(); })
  .catch(() => { FAILED = true; render(); });
Lumen.start("lifecycle", render);
</script>
</body>
</html>
