<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Lumen | vuurvlieg.com</title>
  <meta name="description" content="Lumen: agentic AI, mapped. The Lumen Agentic Atlas and Glimmers, a blog on agentic AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lumen/assets/lumen.css">
  <style>
    .hero { padding: 88px 0 40px; position: relative; }
    .hero .sub { font-family: var(--serif); font-size: clamp(22px, 3vw, 30px); color: var(--gold); margin-top: 6px; }
    .hero .fly { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #f0ffe0; box-shadow: 0 0 10px 3px rgba(170,255,68,.8), 0 0 30px 10px rgba(170,255,68,.25); animation: lm-fly 7s ease-in-out infinite, lm-pulse 3s ease-in-out infinite; }
    @keyframes lm-fly { 0%,100% { transform: translate(0,0) } 33% { transform: translate(10px,-14px) } 66% { transform: translate(-8px,6px) } }
    @keyframes lm-pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

    .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .part { display: block; text-decoration: none; color: var(--text); position: relative; overflow: hidden; transition: border-color .3s, transform .3s; }
    .part:hover { border-color: var(--gold-soft); transform: translateY(-3px); color: var(--text); }
    .part::before { content: ""; position: absolute; width: 220px; height: 220px; right: -80px; top: -80px; border-radius: 50%; background: radial-gradient(rgba(170,255,68,.14), transparent 70%); }
    .part .num { font-size: 44px; font-weight: 300; line-height: 1; color: var(--gold); text-shadow: 0 0 24px rgba(200,168,75,.3); }
    .part .kind { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: var(--glow); margin-top: 12px; }
    .part h3 { font-family: var(--serif); font-weight: 600; font-size: 32px; line-height: 1.1; margin: 4px 0 10px; }
    .part p { color: #c4beae; font-size: 15px; margin-bottom: 14px; }
    .part ul { margin: 0 0 16px 18px; color: #c4beae; font-size: 14.5px; }
    .part .go { color: var(--gold); font-size: 13px; letter-spacing: 1px; }
    .latest { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
    .latest b { display: block; font-family: var(--serif); font-weight: 600; font-size: 18px; color: var(--text); }

    /* Hoe de twee delen samenwerken: een cyclus van vier stappen */
    .cycle { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding-top: 34px; }
    .cycle::before { content: ""; position: absolute; left: 12%; right: 12%; top: 11px; height: 1px; background: linear-gradient(90deg, var(--gold), var(--glow), var(--gold)); opacity: .5; }
    .cycle .ff { position: absolute; top: 7px; left: 12%; width: 9px; height: 9px; border-radius: 50%; background: #f0ffe0; box-shadow: 0 0 10px 3px rgba(170,255,68,.85); animation: travel 9s ease-in-out infinite; }
    @keyframes travel { 0% { left: 12%; opacity: 0 } 6% { opacity: 1 } 88% { opacity: 1 } 100% { left: 88%; opacity: 0 } }
    .step { position: relative; }
    .step::before { content: ""; position: absolute; top: -28px; left: 50%; width: 11px; height: 11px; margin-left: -6px; border-radius: 50%; border: 1px solid var(--gold-soft); background: var(--bg); }
    .step .where { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }
    .step .where.blog { color: var(--glow); } .step .where.atlas { color: var(--gold); } .step .where.world { color: var(--muted); }
    .step h3 { font-family: var(--serif); font-weight: 600; font-size: 21px; line-height: 1.2; margin-bottom: 6px; }
    .step p { color: #c4beae; font-size: 14.5px; }
    .loop { margin-top: 26px; text-align: center; font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--text); }
    .loop span { color: var(--gold); font-style: normal; }

    .about { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
    .about p { color: #c4beae; max-width: 640px; }
    .origin { color: var(--muted); font-size: 14px; max-width: 760px; margin-top: 18px; }
    @media (max-width: 860px) { .parts { grid-template-columns: 1fr; } .cycle { grid-template-columns: 1fr 1fr; row-gap: 40px; } .cycle::before, .cycle .ff { display: none; } }
    @media (max-width: 480px) { .cycle { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main id="app"></main>
<script src="/lumen/assets/lumen.js"></script>
<script>
const TXT = {
  en: {
    eyebrow: "vuurvlieg.com · Lumen",
    sub: "Agentic AI, mapped",
    kern: "An agent earns its room to act through controls, not the other way around.",
    lead: "Lumen is where I keep track of agentic AI and share how I look at it. My angle is that of the IT integrator: the real work sits on the seams, between model and code, between agent and source systems, and between agent and people.",
    partsEyebrow: "Two parts", partsTitle: "One way of looking, in two forms",
    atlasKind: "The framework", atlasT: "Lumen Agentic Atlas",
    atlasD: "My framework for agentic AI, as an interactive map. It shows how an agent architecture grows over six maturity levels, and which controls grow along with it.",
    atlasL: ["Three principles and six maturity levels", "An interactive map: follow a customer request step by step", "A trend log that shows where every new development lands"],
    atlasGo: "Open the Agentic Atlas →",
    blogKind: "The blog", blogT: "Glimmers",
    blogD: "Monthly posts on what is new in agentic AI. Each one is read through the Atlas, with the same four questions, and ends with a verdict: follow, try or adopt.",
    blogGo: "Read the Glimmers →", latest: "Latest",
    howEyebrow: "How they work together", howTitle: "The blog keeps the Atlas current",
    steps: [
      ["world", "Out there", "Something new appears", "A product, a standard, a paper: every month something shifts in agentic AI."],
      ["blog", "Glimmers", "A Glimmer asks four questions", "Which level does it belong to? Which block changes? What does it mean for the harness? What should the integrator do with it?"],
      ["atlas", "Agentic Atlas", "The answer lands on the map", "The trend appears in the trend log, linked to its level and blocks. When a block really changes, the Atlas changes with it."],
      ["atlas", "Agentic Atlas", "The map sharpens the next look", "Every new development is read against a map that keeps growing. From a Glimmer you jump straight to the spot on the Atlas, and back."]
    ],
    loop: ["The Glimmers keep the Atlas current;", "the Atlas gives the Glimmers their structure."],
    aboutEyebrow: "Who is behind it",
    about: "Lumen is a personal project by Niels van der Heijden. These pages are purely my own view on AI and the place where I keep track of it.",
    aboutGo: "View my profile →",
    origin: "Honest about where it comes from: the framework builds on existing maturity models and Google's public patterns. My contribution is the combination and the integrator's perspective. Examples use a fictional bank and synthetic data."
  },
  nl: {
    eyebrow: "vuurvlieg.com · Lumen",
    sub: "Agentic AI in kaart",
    kern: "Een agent verdient zijn ruimte met controles, niet andersom.",
    lead: "Lumen is de plek waar ik agentic AI bijhoud en laat zien hoe ik ernaar kijk. Ik kijk als IT-integrator: het echte werk zit op de naden, tussen model en code, tussen agent en bronsystemen, en tussen agent en mens.",
    partsEyebrow: "Twee delen", partsTitle: "Eén manier van kijken, in twee vormen",
    atlasKind: "Het framework", atlasT: "Lumen Agentic Atlas",
    atlasD: "Mijn framework voor agentic AI, als interactieve plaat. Het laat zien hoe een agentarchitectuur groeit over zes maturity levels, en welke controles daarin meegroeien.",
    atlasL: ["Drie principes en zes maturity levels", "Een interactieve plaat: volg een klantverzoek stap voor stap", "Een trendlog die laat zien waar elke ontwikkeling landt"],
    atlasGo: "Open de Agentic Atlas →",
    blogKind: "Het blog", blogT: "Lichtpunten",
    blogD: "Maandelijkse stukken over wat er nieuw is in agentic AI. Elk stuk wordt gelezen door de bril van de Atlas, met dezelfde vier vragen, en sluit af met een oordeel: volgen, proberen of inzetten.",
    blogGo: "Lees de Lichtpunten →", latest: "Nieuwste",
    howEyebrow: "Hoe ze samenwerken", howTitle: "Het blog houdt de Atlas actueel",
    steps: [
      ["world", "Daarbuiten", "Er verschijnt iets nieuws", "Een product, een standaard, een paper: elke maand verschuift er iets in agentic AI."],
      ["blog", "Lichtpunten", "Een lichtpunt stelt vier vragen", "Op welk level hoort het? Welk blok verandert er? Wat betekent het voor de harness? Wat moet de integrator ermee?"],
      ["atlas", "Agentic Atlas", "Het antwoord landt op de plaat", "De trend komt in de trendlog, gekoppeld aan zijn level en blokken. Verandert een blok echt, dan verandert de Atlas mee."],
      ["atlas", "Agentic Atlas", "De plaat scherpt de volgende blik", "Elke nieuwe ontwikkeling wordt gelezen tegen een plaat die blijft groeien. Vanuit een lichtpunt spring je direct naar de plek op de Atlas, en terug."]
    ],
    loop: ["De Lichtpunten houden de Atlas actueel;", "de Atlas geeft de Lichtpunten hun structuur."],
    aboutEyebrow: "Wie erachter zit",
    about: "Lumen is een persoonlijk project van Niels van der Heijden. Deze pagina's zijn puur mijn eigen visie op AI en de plek waar ik het bijhoud.",
    aboutGo: "Bekijk mijn profiel →",
    origin: "Eerlijk over de herkomst: het framework bouwt voort op bestaande maturity models en de publieke patronen van Google. Mijn toevoeging is de combinatie en het integratorperspectief. Voorbeelden gebruiken een fictieve bank en synthetische data."
  }
};
let LP = [];

function render() {
  const t = TXT[Lumen.lang], { T, esc } = Lumen;
  const lp = [...LP].sort((a, b) => b.datum.localeCompare(a.datum))[0];
  document.getElementById("app").innerHTML = `
  <section class="hero"><div class="wrap">
    <span class="fly" style="left:72%;top:110px"></span>
    <span class="fly" style="left:86%;top:200px;animation-delay:-2s,-1s;width:5px;height:5px"></span>
    <span class="fly" style="left:64%;top:250px;animation-delay:-4s,-2s;width:4px;height:4px"></span>
    <div class="eyebrow">${esc(t.eyebrow)}</div>
    <h1 class="lm-title">Lumen</h1>
    <div class="sub">${esc(t.sub)}</div>
    <p class="kern">${esc(t.kern)}</p>
    <p class="lead">${esc(t.lead)}</p>
  </div></section>

  <section class="lm-sec"><div class="wrap">
    <div class="eyebrow">${esc(t.partsEyebrow)}</div><h2 class="lm-h2">${esc(t.partsTitle)}</h2>
    <div class="parts">
      <a class="lm-card part reveal" href="/lumen/atlas/">
        <div class="num">1</div><div class="kind">${esc(t.atlasKind)}</div><h3>${esc(t.atlasT)}</h3>
        <p>${esc(t.atlasD)}</p><ul>${t.atlasL.map(x => `<li>${esc(x)}</li>`).join("")}</ul><span class="go">${esc(t.atlasGo)}</span></a>
      <a class="lm-card part reveal" href="/lumen/lichtpunten/">
        <div class="num">2</div><div class="kind">${esc(t.blogKind)}</div><h3>${esc(t.blogT)}</h3>
        <p>${esc(t.blogD)}</p><span class="go">${esc(t.blogGo)}</span>
        ${lp ? `<div class="latest">${esc(t.latest)} · ${esc(Lumen.month(lp.datum))}<b>${esc(T(lp.t))}</b></div>` : ""}</a>
    </div>
  </div></section>

  <section class="lm-sec" style="padding-top:0"><div class="wrap">
    <div class="eyebrow">${esc(t.howEyebrow)}</div><h2 class="lm-h2">${esc(t.howTitle)}</h2>
    <div class="cycle reveal"><span class="ff" aria-hidden="true"></span>
      ${t.steps.map(s => `<div class="step"><div class="where ${s[0]}">${esc(s[1])}</div><h3>${esc(s[2])}</h3><p>${esc(s[3])}</p></div>`).join("")}
    </div>
    <p class="loop reveal">${esc(t.loop[0])} <span>↺</span> ${esc(t.loop[1])}</p>
  </div></section>

  <section class="lm-sec" style="padding-top:0"><div class="wrap">
    <div class="eyebrow">${esc(t.aboutEyebrow)}</div>
    <div class="about"><p>${esc(t.about)}</p><a class="lm-btn" href="/profiel/">${esc(t.aboutGo)}</a></div>
    <p class="origin">${esc(t.origin)}</p>
  </div></section>`;
  Lumen.reveal();
}

Lumen.json("/lumen/data/trends.json").then(d => { LP = d.lichtpunten; render(); }).catch(() => {});
Lumen.start("lumen", render);
</script>
</body>
</html>
